<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Fly Krew Downloader</title>
		<link rel="stylesheet" href="/static/style.css" />
	</head>
	<body>
		<div id="animation-container" class="animation-container">
			<div id="starfield" class="starfield"></div>
			<div id="cursor-trail" class="cursor-trail"></div>
		</div>
		<main class="page">
			<section class="card">
				<header class="header">
					<h1>FLY KREW DOWNLOADER</h1>
					<p class="subtitle">Rip it baby 🪩</p>
				</header>

				<div class="form">
					<label class="label" for="url-input">SoundCloud or YouTube URL (track or playlist)</label>
					<div class="input-row">
						<input
							id="url-input"
							class="input"
							type="text"
							placeholder="Paste a SoundCloud or YouTube track / playlist link"
							autocomplete="off"
							inputmode="url"
						/>
						<button id="paste-btn" class="button button-secondary icon-btn" type="button" title="Paste from clipboard">📋</button>
					</div>

					<div class="actions">
						<button id="add-btn" class="button button-secondary hidden" type="button">+ Add to queue</button>
						<button id="download-btn" class="button" type="button">Download</button>
						<button id="cancel-btn" class="button button-secondary hidden" type="button">Cancel</button>
						<button id="retry-btn" class="button button-secondary hidden" type="button">Retry</button>
					</div>

					<div class="options" id="options">
						<label class="opt hidden" id="opt-number">
							<input type="checkbox" id="number-tracks" />
							<span>Number tracks <span class="opt-hint">(01 - Artist - Title)</span></span>
						</label>
						<label class="opt hidden" id="opt-anim">
							<input type="checkbox" id="animations-toggle" checked />
							<span>Background animations</span>
						</label>
					</div>

					<div class="queue hidden" id="queue-section">
						<div class="section-title">Queue · <span id="queue-count">0</span></div>
						<ul id="queue-list" class="ul"></ul>
					</div>

					<p id="error" class="error hidden"></p>
				</div>

				<div id="progress" class="progress hidden">
					<div class="progress-top">
						<div class="progress-bar" id="progress-bar">░░░░░░░░░░ 0/0 tracks</div>
						<div class="status" id="status-text">Waiting…</div>
					</div>
					<div class="queue-progress hidden" id="queue-progress"></div>

					<div class="current">
						<div class="section-title">Current track</div>
						<div id="current-track" class="current-track">—</div>
					</div>
				</div>

				<div class="lists hidden" id="track-lists">
					<div class="list" id="completed-list-container">
						<div class="section-title">Completed</div>
						<ul id="completed-list" class="ul"></ul>
					</div>
					<div class="list hidden" id="failed-list-container">
						<div class="section-title">Failed</div>
						<ul id="failed-list" class="ul"></ul>
					</div>
				</div>

				<div id="download" class="download hidden">
					<div class="success-icon">✓</div>
					<div id="success-text" class="success">LETS GET <span class="groovy-text">GROOVY</span> BABY 🕺</div>
					<button id="redownload-btn" class="button button-secondary hidden" type="button">⬇ Download ZIP again</button>
				</div>
			</section>
		</main>

		<script>
			// ---- Config / state -------------------------------------------------
			let features = {
				multi_url_queue: true,
				number_tracks_toggle: true,
				animations_toggle: true,
				redownload_button: true,
			};

			const queue = [];            // pending URLs
			let processing = false;      // a batch is running
			let stopRequested = false;   // Cancel pressed — stop the batch
			let activeJobId = null;      // job currently downloading
			let lastZipJobId = null;     // last job with a ready ZIP (for re-download)
			let heartbeatInterval = null;

			const URL_PATTERN = /^(https?:\/\/([\w-]+\.)*soundcloud\.com\/.+|https?:\/\/on\.soundcloud\.com\/[\w-]+|https?:\/\/([\w-]+\.)*(youtube\.com|youtu\.be)\/.+)/;

			const $ = (id) => document.getElementById(id);
			const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

			// ---- Small helpers --------------------------------------------------
			function setError(message) {
				const el = $('error');
				el.textContent = message || '';
				el.classList.toggle('hidden', !message);
			}

			function setHidden(id, hidden) {
				$(id).classList.toggle('hidden', Boolean(hidden));
			}

			function setButtonDisabled(id, disabled) {
				$(id).disabled = Boolean(disabled);
			}

			function escapeHtml(str) {
				return String(str)
					.replace(/&/g, '&amp;')
					.replace(/</g, '&lt;')
					.replace(/>/g, '&gt;')
					.replace(/"/g, '&quot;')
					.replace(/'/g, '&#039;');
			}

			function progressBarString(completed, total) {
				const segments = 10;
				if (!total || total <= 0) return '░'.repeat(segments) + ' 0/0 tracks';
				const ratio = Math.max(0, Math.min(1, completed / total));
				const filled = Math.round(ratio * segments);
				return '█'.repeat(filled) + '░'.repeat(segments - filled) + ` ${completed}/${total} tracks`;
			}

			function humanStatus(status) {
				const c = status.completed_tracks ?? 0;
				const t = status.total_tracks ?? 0;
				switch (status.status) {
					case 'pending': return 'Starting…';
					case 'downloading': return `Downloading ${c}/${t}`;
					case 'zipping': return 'Zipping…';
					case 'complete': return 'Done ✓';
					case 'cancelled': return 'Cancelled';
					case 'error': return 'Error';
					default: return status.status || 'pending';
				}
			}

			function getNumberTracks() {
				return Boolean(features.number_tracks_toggle && $('number-tracks').checked);
			}

			// ---- Queue UI -------------------------------------------------------
			function renderQueue() {
				const section = $('queue-section');
				const list = $('queue-list');
				$('queue-count').textContent = String(queue.length);
				list.innerHTML = '';
				queue.forEach((url, i) => {
					const li = document.createElement('li');
					li.className = 'li queue-item';
					const span = document.createElement('span');
					span.className = 'queue-url';
					span.textContent = url;
					const btn = document.createElement('button');
					btn.className = 'remove-btn';
					btn.type = 'button';
					btn.textContent = '✕';
					btn.title = 'Remove';
					btn.addEventListener('click', () => {
						queue.splice(i, 1);
						renderQueue();
					});
					li.appendChild(span);
					li.appendChild(btn);
					list.appendChild(li);
				});
				// Only show the queue panel when the feature is on and there is something queued.
				section.classList.toggle('hidden', !(features.multi_url_queue && queue.length > 0));
			}

			function updateQueueProgress(index, total) {
				const el = $('queue-progress');
				if (total > 1) {
					el.textContent = `Item ${index} of ${total}`;
					el.classList.remove('hidden');
				} else {
					el.classList.add('hidden');
				}
			}

			// ---- Progress rendering --------------------------------------------
			function updateProgressUI(status) {
				const isTerminal = ['complete', 'cancelled', 'error'].includes(status.status);
				if (isTerminal && status.zip_ready) {
					setHidden('progress', true);
					setHidden('download', false);
					setHidden('track-lists', false);
				} else {
					setHidden('progress', false);
					setHidden('download', true);
					setHidden('track-lists', !(status.status === 'downloading' || status.status === 'zipping'));
				}

				const completed = status.completed_tracks ?? 0;
				const total = status.total_tracks ?? 0;
				const current = status.current_track ?? '—';

				$('progress-bar').textContent = progressBarString(completed, total);

				const currentSection = document.querySelector('.current');
				const hideCurrent = ['zipping', 'complete', 'cancelled'].includes(status.status) || !current || current === '—';
				currentSection.style.display = hideCurrent ? 'none' : 'block';
				if (!hideCurrent) $('current-track').textContent = current;

				$('status-text').textContent = humanStatus(status);

				const completedList = $('completed-list');
				completedList.innerHTML = '';
				for (const track of status.completed_tracks_info || []) {
					const li = document.createElement('li');
					li.className = 'li';
					li.textContent = `✓ ${track}`;
					completedList.appendChild(li);
				}

				const failedList = $('failed-list');
				const failedContainer = $('failed-list-container');
				const trackLists = $('track-lists');
				failedList.innerHTML = '';
				const errors = Array.isArray(status.errors) ? status.errors : [];
				if (errors.length > 0) {
					failedContainer.classList.remove('hidden');
					trackLists.classList.remove('centered');
					for (const err of errors) {
						const index = err.index ?? 0;
						const li = document.createElement('li');
						li.className = 'li li-error';
						li.innerHTML = `${escapeHtml(index ? `#${index} ` : '')}${escapeHtml(err.title ?? '')} — ${escapeHtml(err.error ?? 'Unknown error')}`;
						failedList.appendChild(li);
					}
				} else {
					failedContainer.classList.add('hidden');
					trackLists.classList.add('centered');
				}
			}

			function pulseCard(status) {
				const card = document.querySelector('.card');
				card.classList.toggle('card-pulse', status.status === 'downloading' || status.status === 'zipping');
			}

			// ---- Download flow --------------------------------------------------
			function triggerZipDownload(jobId) {
				const a = document.createElement('a');
				a.href = `/api/result/${jobId}`;
				a.download = '';
				a.style.display = 'none';
				document.body.appendChild(a);
				a.click();
				a.remove();
			}

			function handleServerDown() {
				stopPolling();
				setButtonDisabled('download-btn', false);
				setHidden('cancel-btn', true);
				setHidden('progress', true);
				setHidden('download', true);
				setHidden('track-lists', true);
				setError('Fly Krew Downloader is not running. Re-open the app to download again.');
			}

			let pollAbort = false;
			function stopPolling() {
				pollAbort = true;
			}

			// Runs one job to completion. Resolves with the final status.
			async function runJob(url) {
				let resp;
				try {
					resp = await fetch('/api/download', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ url, number_tracks: getNumberTracks() }),
					});
				} catch (e) {
					handleServerDown();
					throw e;
				}

				if (!resp.ok) {
					const body = await resp.json().catch(() => ({}));
					throw new Error(body && body.detail ? body.detail : 'Request failed.');
				}

				const { job_id } = await resp.json();
				activeJobId = job_id;
				pollAbort = false;
				setHidden('cancel-btn', false);
				let triggered = false;

				while (!pollAbort) {
					let status;
					try {
						const r = await fetch(`/api/status/${job_id}`);
						status = await r.json();
					} catch (e) {
						handleServerDown();
						throw e;
					}

					updateProgressUI(status);
					pulseCard(status);

					if (['complete', 'cancelled', 'error'].includes(status.status)) {
						setHidden('cancel-btn', true);
						if (status.zip_ready && !triggered) {
							triggered = true;
							lastZipJobId = job_id;
							triggerZipDownload(job_id);
							if (features.redownload_button) setHidden('redownload-btn', false);
						}
						return status;
					}
					await sleep(2000);
				}
				return null;
			}

			// Adds the URL currently in the input box to the queue (if valid).
			function enqueueInput({ requireValid }) {
				const url = $('url-input').value.trim();
				if (!url) return true; // nothing typed is fine if queue already has items
				if (!URL_PATTERN.test(url)) {
					if (requireValid) setError('Please enter a valid SoundCloud or YouTube URL.');
					return false;
				}
				queue.push(url);
				$('url-input').value = '';
				renderQueue();
				return true;
			}

			async function startDownload() {
				setError('');
				setHidden('download', true);
				setHidden('redownload-btn', true);
				$('retry-btn').classList.add('hidden');

				if (!enqueueInput({ requireValid: true })) return;
				if (queue.length === 0) {
					setError('Add a SoundCloud or YouTube link first.');
					return;
				}

				if (processing) return;
				processing = true;
				stopRequested = false;
				setButtonDisabled('download-btn', true);
				setHidden('progress', false);

				const batchTotal = queue.length;
				let index = 0;
				try {
					while (queue.length > 0 && !stopRequested) {
						const url = queue.shift();
						index += 1;
						renderQueue();
						updateQueueProgress(index, batchTotal);
						try {
							await runJob(url);
						} catch (e) {
							setError(String(e.message || e));
							// keep going with the rest of the queue
						}
					}
				} finally {
					processing = false;
					activeJobId = null;
					updateQueueProgress(0, 0);
					setButtonDisabled('download-btn', false);
					setHidden('cancel-btn', true);
					document.querySelector('.card').classList.remove('card-pulse');
				}
			}

			async function cancelDownload() {
				stopRequested = true;
				stopPolling();
				queue.length = 0;        // drop the rest of the batch
				renderQueue();
				setHidden('cancel-btn', true);
				$('status-text').textContent = 'Cancelling…';
				if (!activeJobId) return;
				try {
					await fetch(`/api/job/${activeJobId}`, { method: 'DELETE' });
				} catch {
					setError('Network error while cancelling.');
				}
			}

			// ---- Heartbeat ------------------------------------------------------
			async function pingServer() {
				try {
					await fetch('/api/ping', { cache: 'no-store' });
				} catch (e) {
					setError('Fly Krew Downloader is not running. Re-open the app to download again.');
				}
			}

			function startHeartbeat() {
				if (heartbeatInterval) return;
				heartbeatInterval = setInterval(pingServer, 60_000);
				pingServer();
			}

			function stopHeartbeat() {
				if (!heartbeatInterval) return;
				clearInterval(heartbeatInterval);
				heartbeatInterval = null;
			}

			// ---- Options (persisted) -------------------------------------------
			function initOptions() {
				const numberPref = localStorage.getItem('fk_number_tracks') === '1';
				$('number-tracks').checked = numberPref;
				$('number-tracks').addEventListener('change', (e) => {
					localStorage.setItem('fk_number_tracks', e.target.checked ? '1' : '0');
				});

				const animPref = localStorage.getItem('fk_animations');
				const animOn = animPref === null ? true : animPref === '1';
				$('animations-toggle').checked = animOn;
				$('animations-toggle').addEventListener('change', (e) => {
					localStorage.setItem('fk_animations', e.target.checked ? '1' : '0');
					if (e.target.checked) startAnimations();
					else stopAnimations();
				});
				return animOn;
			}

			// ---- Feature flags --------------------------------------------------
			async function loadFeatures() {
				try {
					const r = await fetch('/api/features');
					if (r.ok) features = { ...features, ...(await r.json()) };
				} catch {
					/* keep defaults */
				}
				setHidden('add-btn', !features.multi_url_queue);
				setHidden('opt-number', !features.number_tracks_toggle);
				setHidden('opt-anim', !features.animations_toggle);
			}

			// ---- Wire up --------------------------------------------------------
			$('download-btn').addEventListener('click', startDownload);
			$('cancel-btn').addEventListener('click', cancelDownload);
			$('add-btn').addEventListener('click', () => {
				setError('');
				enqueueInput({ requireValid: true });
			});
			$('retry-btn').addEventListener('click', () => {
				stopPolling();
				activeJobId = null;
				setHidden('cancel-btn', true);
				startDownload();
			});
			$('redownload-btn').addEventListener('click', () => {
				if (lastZipJobId) triggerZipDownload(lastZipJobId);
			});
			$('paste-btn').addEventListener('click', async () => {
				try {
					const text = await navigator.clipboard.readText();
					if (text) $('url-input').value = text.trim();
					setError('');
				} catch {
					setError('Could not read clipboard — paste with Ctrl/Cmd+V instead.');
				}
			});
			$('url-input').addEventListener('keydown', (e) => {
				if (e.key === 'Enter') startDownload();
			});

			document.addEventListener('visibilitychange', () => {
				if (document.visibilityState === 'visible') startHeartbeat();
				else stopHeartbeat();
			});

			(async function init() {
				setError('');
				await loadFeatures();
				const animOn = initOptions();
				renderQueue();
				startHeartbeat();
				if (animOn) startAnimations();
				else stopAnimations();
			})();

			// ========================================
			// Background Animations
			// ========================================
			const animationContainer = $('animation-container');
			const isMobile = () => window.innerWidth < 560;

			let animRunning = false;
			let animTimers = [];
			let cursorHandler = null;

			function schedule(fn, delay) {
				const id = setTimeout(() => {
					animTimers = animTimers.filter((t) => t !== id);
					if (animRunning) fn();
				}, delay);
				animTimers.push(id);
			}

			function spawnPlane() {
				const planes = ['✈️', '🛩️', '🪂'];
				const plane = document.createElement('div');
				plane.className = 'plane';
				plane.textContent = planes[Math.floor(Math.random() * planes.length)];

				const topPercent = 10 + Math.random() * 70;
				plane.style.top = topPercent + '%';
				plane.style.left = '-100px';

				const isDiagonal = Math.random() < 0.2;
				const duration = 8000 + Math.random() * 4000;
				animationContainer.appendChild(plane);

				const noteInterval = setInterval(() => {
					const rect = plane.getBoundingClientRect();
					if (!plane.isConnected || rect.left > window.innerWidth) {
						clearInterval(noteInterval);
						return;
					}
					const note = document.createElement('div');
					note.className = 'musical-note';
					note.textContent = ['♪', '♫'][Math.floor(Math.random() * 2)];
					note.style.left = rect.left + rect.width / 2 + 'px';
					note.style.top = rect.top + rect.height / 2 + 'px';
					animationContainer.appendChild(note);
					setTimeout(() => note.remove(), 2000);
				}, 500);

				const startTime = Date.now();
				const animate = () => {
					const progress = (Date.now() - startTime) / duration;
					if (progress >= 1) {
						clearInterval(noteInterval);
						plane.remove();
						return;
					}
					plane.style.left = -100 + (window.innerWidth + 200) * progress + 'px';
					plane.style.top = (isDiagonal ? topPercent + 20 * progress : topPercent) + '%';
					requestAnimationFrame(animate);
				};
				requestAnimationFrame(animate);
			}

			function planeSpawnLoop() {
				const next = () => {
					const isActive = processing;
					const base = isActive ? 5000 : 10000;
					const variance = isActive ? 5000 : 10000;
					const mult = isMobile() ? 1.5 : 1;
					schedule(() => {
						spawnPlane();
						next();
					}, (base + Math.random() * variance) * mult);
				};
				next();
			}

			function spawnOrb() {
				const colors = [
					'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
					'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
					'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
					'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
					'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
				];
				const orb = document.createElement('div');
				orb.className = 'color-orb';
				const size = (40 + Math.random() * 60) * (isMobile() ? 0.6 : 1);
				orb.style.width = size + 'px';
				orb.style.height = size + 'px';
				orb.style.left = 5 + Math.random() * 90 + '%';
				orb.style.top = 10 + Math.random() * 80 + '%';
				orb.style.background = colors[Math.floor(Math.random() * colors.length)];
				animationContainer.appendChild(orb);
				setTimeout(() => orb.remove(), 3600);
			}

			function orbSpawnLoop() {
				const next = () => {
					schedule(() => {
						spawnOrb();
						next();
					}, (8000 + Math.random() * 7000) * (isMobile() ? 1.3 : 1));
				};
				next();
			}

			function spawnStar() {
				const starfield = $('starfield');
				const star = document.createElement('div');
				star.className = 'star';
				const size = 1 + Math.random() * 2;
				star.style.width = size + 'px';
				star.style.height = size + 'px';
				star.style.left = Math.random() * 100 + '%';
				star.style.top = Math.random() * 100 + '%';
				star.style.animationDuration = 20 + Math.random() * 20 + 's';
				star.style.opacity = 0.3 + Math.random() * 0.4;
				starfield.appendChild(star);
			}

			function initStarfield() {
				$('starfield').innerHTML = '';
				const count = isMobile() ? 30 : 50;
				for (let i = 0; i < count; i++) spawnStar();
			}

			function startAnimations() {
				if (animRunning) return;
				animRunning = true;
				animationContainer.style.display = '';
				initStarfield();
				planeSpawnLoop();
				orbSpawnLoop();
				if (!isMobile()) {
					let lastTrail = 0;
					cursorHandler = (e) => {
						const now = Date.now();
						if (now - lastTrail < 100) return;
						lastTrail = now;
						const trail = document.createElement('div');
						trail.className = 'trail-note';
						trail.textContent = ['♪', '♫', '♬'][Math.floor(Math.random() * 3)];
						trail.style.left = e.pageX + 'px';
						trail.style.top = e.pageY + 'px';
						$('cursor-trail').appendChild(trail);
						setTimeout(() => trail.remove(), 900);
					};
					document.addEventListener('mousemove', cursorHandler);
				}
			}

			function stopAnimations() {
				animRunning = false;
				animTimers.forEach(clearTimeout);
				animTimers = [];
				if (cursorHandler) {
					document.removeEventListener('mousemove', cursorHandler);
					cursorHandler = null;
				}
				animationContainer.style.display = 'none';
			}
		</script>
	</body>
</html>
